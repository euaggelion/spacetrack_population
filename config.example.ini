# Copier ce fichier en config.ini et le renseigner.
# config.ini est ignoré par git : il ne doit jamais être commité.

[spacetrack]
login = ton.email@example.com
password = ton_mot_de_passe

[satcat]
# Dossier où sont enregistrés les fichiers satcat_AAAAMMJJ.csv
output_dir = /chemin/vers/TLE_database/satcat

[tle_snapshot]
# Dossier où sont enregistrés les fichiers tle_AAAAMMJJ_AAAAMMJJ.csv
output_dir = /chemin/vers/TLE_database

[tle_history]
# Dossier où sont enregistrés les fichiers <norad>.txt
output_dir = /chemin/vers/TLE_database/history
# Format de sortie : tle, 3le, json, csv, xml (défaut : tle)
format = tle

[orekit]
# Fichier (ou dossier) de données Orekit
data_path = /chemin/vers/orekit-data.zip
